services:
  ingestion:
    build:
      context: .
      dockerfile: backend/Dockerfile
    command: >
      sh -c "python ingestion/app/load_odi_csv.py &&
             python ingestion/app/profile_dataset.py"
    environment:
      APP_ENV: ${APP_ENV:-development}
      DUCKDB_PATH: ${DUCKDB_PATH:-/app/data/odi_analytics.duckdb}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_DEFAULT_MODEL: ${GEMINI_DEFAULT_MODEL:-gemini-2.5-pro}
      GEMINI_COMPLEX_MODEL: ${GEMINI_COMPLEX_MODEL:-gemini-2.5-pro}
      USE_SEMANTIC_ANALYTICS_V2: ${USE_SEMANTIC_ANALYTICS_V2:-true}
      SEMANTIC_V2_DEV_FALLBACK: ${SEMANTIC_V2_DEV_FALLBACK:-false}
    volumes:
      - ./data:/app/data
      - ./docs:/app/docs
    restart: "no"

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      APP_ENV: ${APP_ENV:-development}
      DUCKDB_PATH: ${DUCKDB_PATH:-/app/data/odi_analytics.duckdb}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_DEFAULT_MODEL: ${GEMINI_DEFAULT_MODEL:-gemini-2.5-pro}
      GEMINI_COMPLEX_MODEL: ${GEMINI_COMPLEX_MODEL:-gemini-2.5-pro}
      USE_SEMANTIC_ANALYTICS_V2: ${USE_SEMANTIC_ANALYTICS_V2:-true}
      SEMANTIC_V2_DEV_FALLBACK: ${SEMANTIC_V2_DEV_FALLBACK:-false}
    depends_on:
      ingestion:
        condition: service_completed_successfully
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
      - ./docs:/app/docs
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health').read()",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    environment:
      BACKEND_INTERNAL_URL: ${BACKEND_INTERNAL_URL:-http://backend:8000}
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-}
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "3000:3000"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
