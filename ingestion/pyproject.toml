[project]
name = "odi-analyst-ingestion"
version = "0.1.0"
description = "Ingestion and profiling tools for CricAtlas"
requires-python = ">=3.12"
dependencies = [
  "duckdb>=1.1.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.0",
]

[build-system]
requires = ["setuptools>=69.0"]
build-backend = "setuptools.build_meta"
