[project]
name = "odi-analyst-backend"
version = "0.1.0"
description = "Backend domain contracts for the ODI Analyst Workbench"
requires-python = ">=3.12"
dependencies = [
  "pydantic>=2.9.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.0",
]

[build-system]
requires = ["setuptools>=69.0"]
build-backend = "setuptools.build_meta"
