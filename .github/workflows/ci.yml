name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt pytest
      - name: Run data-independent tests
        run: >-
          pytest -q
          tests/ingestion/test_bootstrap_data.py
          tests/ingestion/test_profile_dataset.py
          tests/backend/test_answer_composer.py
          tests/backend/test_player_resolution.py
          tests/backend/test_explorer_modes.py
          tests/backend/test_venue_bowling_leaderboard.py
          tests/streamlit/test_compare_venue_explorers.py
          tests/streamlit/test_explorer_mode_controls.py
          tests/streamlit/test_issue_56_venue_leaderboard.py
      - name: Compile Python entry points
        run: python -m compileall backend ingestion scripts streamlit_app.py

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build

  containers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Validate Compose configuration
        run: docker compose config --quiet
      - name: Build application images
        run: docker compose build backend frontend
