  - prompt: Compare Virat Kohli's strike rate against left-arm versus right-arm bowlers.
    expected: {mode: analysis, status: supported, evidence: required, plan: {operation: split_compare, entity: batter, metric: batting_strike_rate, split_by: bowling_style_group, compare_values: [left_arm, right_arm], filters: {batter: Virat Kohli}}}
- id: holdout-split-starc-phases
  family: split
