    expected: {mode: analysis, status: supported, evidence: required, plan: {operation: aggregate, entity: bowler, metric: economy_rate, filters: {bowler: Jasprit Bumrah}}}
- id: holdout-behavior-ambiguous-sr
  family: behavior
