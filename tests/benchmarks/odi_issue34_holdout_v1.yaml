    expected: {mode: analysis, status: supported, evidence: required, plan: {operation: aggregate, entity: bowler, metric: economy_rate, group_by: [year], filters: {bowler: Kagiso Rabada, phase: powerplay, years: [2019], year_mode: after}}}
- id: holdout-context-venue
  family: context
  planner_mode: production_live
  turns:
  - prompt: What is Virat Kohli's batting strike rate?
    expected: {mode: analysis, status: supported, evidence: required}
