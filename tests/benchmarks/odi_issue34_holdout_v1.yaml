    expected: {mode: analysis, status: supported, evidence: required, plan: {operation: aggregate, entity: batter, metric: batting_strike_rate, filters: {batter: Virat Kohli, opposition: Australia, venue: "Lord's, London"}}}
- id: holdout-context-remove-filter
  family: context
  planner_mode: production_live
  turns:
  - prompt: Show Jasprit Bumrah's economy in the powerplay.
    expected: {mode: analysis, status: supported, evidence: required}
