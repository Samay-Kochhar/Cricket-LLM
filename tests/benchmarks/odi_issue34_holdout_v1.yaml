version: 1
name: ODI issue 34 untouched holdout
frozen_at: '2026-09-14'
design: 20 independently written questions frozen before their first production execution; results are not used for implementation tuning
cases:
- id: holdout-direct-smith-england-runs
  family: direct
  planner_mode: production_live
  turns:
  - prompt: Steven Smith's ODI runs against England?
    expected: {mode: analysis, status: supported, evidence: required, plan: {operation: aggregate, entity: batter, metric: runs_scored, filters: {batter: Steven Smith, opposition: England}}}
- id: holdout-direct-boult-opening-economy
  family: direct
  planner_mode: production_live
  turns:
  - prompt: What is Trent Boult's economy during the opening ten overs?
    expected: {mode: analysis, status: supported, evidence: required, plan: {operation: aggregate, entity: bowler, metric: economy_rate, filters: {bowler: Trent Boult, phase: powerplay}}}
- id: holdout-direct-maxwell-death-boundaries
  family: direct
  planner_mode: production_live
  turns:
  - prompt: Glenn Maxwell boundary percentage after over 40?
    expected: {mode: analysis, status: supported, evidence: required, plan: {operation: aggregate, entity: batter, metric: boundary_percentage, filters: {batter: Glenn Maxwell, phase: death}}}
- id: holdout-ranking-controlled-batters
  family: ranking
  planner_mode: production_live
  turns:
  - prompt: List the six batters with the lowest false-shot percentage, minimum 120 balls.
    expected: {mode: analysis, status: supported, evidence: required, plan: {operation: aggregate, entity: batter, metric: false_shot_percentage, limit: 6, minimum_sample: {balls: 120}, minimum_sample_explicit: true, sort: {by: false_shot_percentage, direction: asc}}}
- id: holdout-ranking-middle-economy
  family: ranking
  planner_mode: production_live
  turns:
  - prompt: Four most economical bowlers in overs 11-40 with at least 300 legal deliveries?
    expected: {mode: analysis, status: supported, evidence: required, plan: {operation: aggregate, entity: bowler, metric: economy_rate, filters: {phase: middle}, limit: 4, minimum_sample: {legal_balls: 300}, minimum_sample_explicit: true, sort: {by: economy_rate, direction: asc}}}
- id: holdout-ranking-wickets-india
  family: ranking
  planner_mode: production_live
  turns:
  - prompt: Which five bowlers have taken the most ODI wickets against India?
    expected: {mode: analysis, status: supported, evidence: required, plan: {operation: aggregate, entity: bowler, metric: wickets_taken, filters: {opposition: India}, limit: 5, sort: {by: wickets_taken, direction: desc}}}
- id: holdout-breakdown-babar-shots
  family: breakdown
  planner_mode: production_live
  turns:
  - prompt: Break Babar Azam's run total down by shot type.
    expected: {mode: analysis, status: supported, evidence: required, plan: {operation: aggregate, entity: batter, metric: runs_scored, group_by: [shot_type], filters: {batter: Babar Azam}}}
- id: holdout-breakdown-shaheen-phase
  family: breakdown
  planner_mode: production_live
  turns:
  - prompt: Show Shaheen Shah Afridi's wickets across innings phases.
    expected: {mode: analysis, status: supported, evidence: required, plan: {operation: aggregate, entity: bowler, metric: wickets_taken, group_by: [phase], filters: {bowler: Shaheen Shah Afridi}}}
