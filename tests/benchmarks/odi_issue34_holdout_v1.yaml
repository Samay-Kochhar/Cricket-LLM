  - prompt: How has David Warner scored against Ravichandran Ashwin in ODIs?
    expected: {mode: analysis, status: supported, evidence: required, plan: {operation: matchup, entity: batter, metric: batting_strike_rate, filters: {batter: David Warner, bowler: Ravichandran Ashwin}}}
- id: holdout-matchup-rohit-dismissers
