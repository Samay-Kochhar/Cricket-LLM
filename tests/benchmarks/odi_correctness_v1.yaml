version: 1
name: ODI real-chat correctness gate
cases:
  - id: standalone-batting-strike-rate
    family: standalone
    outcome: supported
    turns:
      - prompt: What is Virat Kohli's batting strike rate against Australia?
        expected:
          mode: analysis
          status: supported
          plan:
            operation: aggregate
            entity: batter
            metric: batting_strike_rate
            group_by: [batter]
            filters:
              batter: Virat Kohli
              opposition: Australia
          result:
            columns: [Batter, Batting Strike Rate, Runs Scored, Balls Faced, Matches]
            rows:
              - {Batter: Virat Kohli, Batting Strike Rate: 94.0, Runs Scored: 2367, Balls Faced: 2518, Matches: 47}
          message_contains: ["94.0", "2518 balls"]
          evidence: required

  - id: player-comparison
    family: comparison
    outcome: supported
    turns:
      - prompt: Compare Virat Kohli and Rohit Sharma by runs scored.
        expected:
          mode: analysis
          status: supported
          plan:
            operation: player_compare
            entity: batter
            metric: batting_strike_rate
            group_by: [batter]
            filters:
              compare_players: [Virat Kohli, Rohit Sharma]
              comparison_metrics: [batting_strike_rate, runs_scored, batting_average, batter_dot_ball_percentage, boundary_percentage]
          result:
            columns: [Player, Runs Scored, Batting Strike Rate, Balls Faced]
            rows:
              - {Player: Virat Kohli, Runs Scored: 13950, Batting Strike Rate: 93.51, Balls Faced: 14918}
              - {Player: Rohit Sharma, Runs Scored: 10970, Batting Strike Rate: 92.64, Balls Faced: 11841}
          message_contains: ["Virat Kohli", "13950", "Rohit Sharma", "10970"]
          evidence: required

  - id: batter-bowler-matchup
    family: matchup
    outcome: supported
    turns:
      - prompt: Who has dismissed David Miller most often?
        expected:
          mode: analysis
          status: supported
          plan:
            operation: matchup
            entity: bowler
            metric: wickets_taken
            group_by: [bowler]
            filters: {batter: David Miller}
          result:
            columns: [Batter, Bowler, Wickets Taken, Balls]
            rows:
              - {Batter: David Miller, Bowler: Suranga Lakmal, Wickets Taken: 5, Balls: 32}
          message_contains: ["Suranga Lakmal", "5"]
          evidence: required

  - id: contextual-phase-follow-up
    family: contextual_follow_up
    outcome: supported
    turns:
      - prompt: What is Virat Kohli's batting strike rate?
        expected:
          mode: analysis
          status: supported
          plan:
            operation: aggregate
            entity: batter
            metric: batting_strike_rate
            filters: {batter: Virat Kohli}
          evidence: required
      - prompt: And in death overs?
        expected:
          mode: analysis
          status: supported
          resolved_input_contains: [Virat Kohli, batting strike rate, death overs]
          plan:
            operation: aggregate
            entity: batter
            metric: batting_strike_rate
            filters: {batter: Virat Kohli, phase: death}
          result:
            rows:
              - {Batter: Virat Kohli, Batting Strike Rate: 149.9, Runs Scored: 1523, Balls Faced: 1016}
          message_contains: ["149.9", "1016 balls"]
          evidence: required

  - id: batting-strike-rate-ranking
    family: ranking
    outcome: supported
    turns:
      - prompt: Which batter has the highest batting strike rate?
        expected:
          mode: analysis
          status: supported
          plan:
            operation: aggregate
            entity: batter
            metric: batting_strike_rate
            group_by: [batter]
            minimum_sample: {balls: 60}
          result:
            rows:
              - {Batter: Odean Smith, Batting Strike Rate: 167.23, Balls Faced: 119}
          message_contains: ["Odean Smith", "167.23", "119 balls"]
          evidence: required

  - id: most-yorkers-ranks-count
    family: ranking
    outcome: supported
    turns:
      - prompt: Show the top 3 bowlers who bowled the most yorkers at the death
        expected:
          mode: analysis
          status: supported
          plan:
            operation: aggregate
            entity: bowler
            metric: yorker_count
            group_by: [bowler]
            filters: {phase: death}
            sort: {by: yorker_count, direction: desc}
            limit: 3
          result:
            columns: [Bowler, Yorker Count, Legal Balls, Matches]
            rows:
              - {Bowler: Jasprit Bumrah, Yorker Count: 144, Legal Balls: 1123, Matches: 66}
              - {Bowler: Mitchell Starc, Yorker Count: 101, Legal Balls: 1037, Matches: 75}
              - {Bowler: Trent Boult, Yorker Count: 87, Legal Balls: 923, Matches: 73}
          message_contains: ["Jasprit Bumrah", "144", "1123 legal balls"]
          evidence: required

  - id: highest-yorker-percentage-ranks-rate
    family: ranking
    outcome: supported
    turns:
      - prompt: Which bowler has the highest yorker percentage?
        expected:
          mode: analysis
          status: supported
          plan:
            operation: aggregate
            entity: bowler
            metric: yorker_percentage
            group_by: [bowler]
            sort: {by: yorker_percentage, direction: desc}
            minimum_sample: {legal_balls: 60}
          result:
            columns: [Bowler, Yorker Percentage, Yorker Balls, Legal Balls, Matches]
            rows:
              - {Bowler: T Natarajan, Yorker Percentage: 10.0, Yorker Balls: 12, Legal Balls: 120, Matches: 2}
          message_contains: ["T Natarajan", "10.0%", "120 legal balls"]
          evidence: required

  - id: worst-economy-explicit-limit-and-sample
    family: ranking
    outcome: supported
    turns:
      - prompt: Show the 4 bowlers with the worst economy rate, minimum 100 legal balls
        expected:
          mode: analysis
          status: supported
          plan:
            operation: aggregate
            entity: bowler
            metric: economy_rate
            group_by: [bowler]
            sort: {by: economy_rate, direction: desc}
            limit: 4
            minimum_sample: {legal_balls: 100}
            minimum_sample_explicit: true
          result:
            columns: [Bowler, Economy Rate, Runs Conceded, Legal Balls, Matches]
            rows:
              - {Bowler: Abdool Samad, Economy Rate: 8.65, Runs Conceded: 183, Legal Balls: 127, Matches: 9}
              - {Bowler: Sherfane Rutherford, Economy Rate: 8.64, Runs Conceded: 154, Legal Balls: 107, Matches: 5}
          message_contains: ["minimum sample of 100 legal balls", "Abdool Samad", "8.65"]
          evidence: required

  - id: fully-filtered-spin-ranking
    family: ranking
    outcome: supported
    turns:
      - prompt: Show the top 5 batters by highest false shot percentage against spin at R Premadasa Stadium, Colombo in middle overs in 2009 against Sri Lanka, minimum 20 balls
        expected:
          mode: analysis
          status: supported
          plan:
            operation: aggregate
            entity: batter
            metric: false_shot_percentage
            group_by: [batter]
            filters:
              bowling_style: spin
              venue: R Premadasa Stadium, Colombo
              phase: middle
              years: [2009]
              opposition: Sri Lanka
            sort: {by: false_shot_percentage, direction: desc}
            limit: 5
            minimum_sample: {balls: 20}
            minimum_sample_explicit: true
          result:
            columns: [Batter, False Shot Percentage, False Shots, Balls Faced, Matches]
            rows:
              - {Batter: Yuvraj Singh, False Shot Percentage: 16.67, False Shots: 20, Balls Faced: 120, Matches: 6}
          message_contains: ["Yuvraj Singh", "16.67", "minimum sample of 20 balls", "against spin", "middle overs", "against Sri Lanka", "R Premadasa Stadium"]
          evidence: required

  - id: line-breakdown
    family: breakdown
    outcome: supported
    turns:
      - prompt: Which line produces the most dot balls against Virat Kohli?
        expected:
          mode: analysis
          status: supported
          plan:
            operation: aggregate
            entity: bowler
            metric: bowler_dot_ball_percentage
            group_by: [line]
            filters: {batter: Virat Kohli}
          result:
            rows:
              - {Line: outside offstump, Bowler Dot Ball Percentage: 47.46, Bowler Dot Balls: 2230, Legal Balls: 4699}
          message_contains: ["outside offstump", "47.46%", "4699 legal balls"]
          evidence: required

  - id: named-batter-line-scoring-breakdown
    family: breakdown
    outcome: supported
    turns:
      - prompt: Which line does Virat Kohli score most against?
        expected:
          mode: analysis
          status: supported
          plan:
            operation: aggregate
            entity: batter
            metric: runs_scored
            group_by: [line]
            filters: {batter: Virat Kohli}
          result:
            columns: [Line, Runs Scored, Balls Faced, Matches]
            rows:
              - {Line: outside offstump, Runs Scored: 4179, Balls Faced: 4704, Matches: 156}
          message_contains: ["Virat Kohli", "outside offstump", "4179", "4704 balls"]
          evidence: required

  - id: named-bowler-dot-count-by-length
    family: breakdown
    outcome: supported
    turns:
      - prompt: How many dot balls does Bumrah bowl by length?
        expected:
          mode: analysis
          status: supported
          plan:
            operation: aggregate
            entity: bowler
            metric: bowler_dot_balls
            group_by: [length]
            filters: {bowler: Jasprit Bumrah}
          result:
            columns: [Length, Bowler Dot Balls, Legal Balls, Matches]
            rows:
              - {Length: good length, Bowler Dot Balls: 1228, Legal Balls: 1867, Matches: 88}
          message_contains: ["Jasprit Bumrah", "good length", "1228", "1867 legal balls"]
          evidence: required

  - id: exact-off-spin-filter
    family: breakdown
    outcome: supported
    turns:
      - prompt: What is Maxwell's batting strike rate against off spin bowling?
        expected:
          mode: analysis
          status: supported
          plan:
            operation: aggregate
            entity: batter
            metric: batting_strike_rate
            group_by: [batter]
            filters: {batter: Glenn Maxwell, bowling_style: off_spin}
          result:
            columns: [Batter, Batting Strike Rate, Runs Scored, Balls Faced, Matches]
            rows:
              - {Batter: Glenn Maxwell, Batting Strike Rate: 134.22, Runs Scored: 608, Balls Faced: 453, Matches: 47}
          message_contains: ["off spin", "Glenn Maxwell", "134.22", "453 balls"]
          evidence: required

  - id: year-by-year-trend
    family: trend
    outcome: supported
    turns:
      - prompt: Show Virat Kohli's batting strike rate year by year.
        expected:
          mode: analysis
          status: supported
          plan:
            operation: aggregate
            entity: batter
            metric: batting_strike_rate
            group_by: [year]
            filters: {batter: Virat Kohli}
          result:
            columns: [Year, Batting Strike Rate, Runs Scored, Balls Faced]
            rows:
              - {Year: 2018, Batting Strike Rate: 102.56, Runs Scored: 1202, Balls Faced: 1172}
          message_contains: ["2018", "102.56"]
          evidence: required

  - id: ambiguous-strike-rate
    family: ambiguity
    outcome: ambiguous
    turns:
      - prompt: What is Jasprit Bumrah's strike rate?
        expected:
          mode: clarification
          clarification_labels: [Batting strike rate, Bowling strike rate]
          message_contains: ["Do you mean batting strike rate or bowling strike rate?"]

  - id: ambiguous-best-statistics
    family: ambiguity
    outcome: ambiguous
    turns:
      - prompt: Who has the best statistics?
        expected:
          mode: clarification
          clarification_labels: [Runs scored, Batting strike rate, Wickets taken, Economy rate]
          message_contains: ["Which metric"]

  - id: unsupported-team-economy
    family: unsupported
    outcome: unsupported
    turns:
      - prompt: Which team has the best economy against India?
        expected:
          mode: analysis
          status: unsupported
          failure_state: unsupported_capability
          message_contains: ["need explicit tested team semantics"]

  - id: missing-fielding-data
    family: missing_data
    outcome: missing_data
    turns:
      - prompt: Who has taken the most catches in the 2019 World Cup?
        expected:
          mode: analysis
          status: insufficient_evidence
          failure_state: data_limitation
          message_contains: ["fielding catcher records are missing"]

  - id: planner-unavailable
    family: planner_failure
    outcome: supported
    planner_mode: production_unavailable
    turns:
      - prompt: What is Virat Kohli's batting strike rate against Australia?
        expected:
          mode: analysis
          status: supported
          plan:
            operation: aggregate
            entity: batter
            metric: batting_strike_rate
            filters: {batter: Virat Kohli, opposition: Australia}
          evidence: required
