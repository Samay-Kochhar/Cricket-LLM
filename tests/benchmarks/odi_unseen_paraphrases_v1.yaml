version: 1
name: ODI unseen production paraphrase benchmark
frozen_at: '2026-09-01'
design: 75 independently specified cricket meanings, each expressed through two previously unused phrasings
cases:
- id: unseen-direct-kohli-runs-aus-a
  family: direct
  planner_mode: production_live
  turns:
  - prompt: Kohli's ODI run tally versus Australia?
    expected:
      mode: analysis
      status: supported
      evidence: required
      plan:
        operation: aggregate
        entity: batter
        metric: runs_scored
        filters:
          batter: Virat Kohli
          opposition: Australia
