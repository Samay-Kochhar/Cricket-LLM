numeric_note: This semantic review complements the database top-row score. It credits equivalent result shapes and operation choices when the visible answer preserves the requested meaning.
rubric:
  semantic_capability:
    pass: The database-backed answer preserves the requested entity, role, metric, comparison or split, and filters.
    fail: The production planner declines the answer or changes a material metric, dimension, or filter.
  safeguard_aware:
    pass: Semantic capability passes and CricAtlas applies its registered sample safeguard.
    fail: Semantic capability fails or a required safeguard is absent.
