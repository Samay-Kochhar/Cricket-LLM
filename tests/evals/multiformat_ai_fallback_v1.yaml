- id: ai-08
  set: B
  question: Which bowler has bowled the most maiden overs in the IPL?
  expect: >-
    Tie: P Kumar and B Kumar, 14 maidens each (a maiden = a complete six-legal-ball over by one
    bowler conceding no runs off the bat, wides or no-balls); then TA Boult 11.
  key_numbers: [14]

- id: ai-09
  set: B
  question: How many ducks has Babar Azam made in T20Is?
  expect: 10 ducks (dismissed for 0) in men's T20Is.
  key_numbers: [10]

- id: ai-10
