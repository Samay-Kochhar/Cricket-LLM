- id: chat-follow-up-bumrah-starc-death-bowling-trend
  endpoint: chat
  message: Compare this trend against another ODI player. mitchell starc
  history:
    - role: user
      content: What is Jasprit Bumrah economy rate in death overs?
    - role: assistant
      content: In death overs, Jasprit Bumrah economy is 5.78 runs per over.
    - role: user
      content: Break the player down year by year to inspect role changes over time.
    - role: assistant
      content: The ODI bowling trend for Jasprit Bumrah in death overs covers 7 recorded years.
  expected_query_class: trend_progression
  expected_status: supported
  expected_entities:
    - Jasprit Bumrah
    - Mitchell Starc
  expected_filters:
    phase: death
    skill: bowling
  required_evidence:
    - tables
    - evidence_queries
    - citations
  required_table_titles:
    - Aggregate bowling trend comparison
  forbidden_table_titles:
    - Year trend
    - Fetched bowling year trend
    - Year-by-year bowling trend comparison
  required_sql_fragments:
    - bowl AS player
    - COUNT(DISTINCT p_match) AS matches
    - WHERE bowl IN (:players)
    - TRY_CAST(over AS DOUBLE) > 40.0
    - GROUP BY bowl, year

- id: bowling-economy-leaderboard-death-since-2022
  endpoint: chat
  message: Which bowler has the best death-over economy since 2022?
  history: []
  expected_query_class: venue_context_leaderboard
  expected_status: supported
  expected_filters:
    phase: death
    skill: bowling
    metric: economy_rate
    year_mode: after
    rank_intent: best
  required_evidence:
    - tables
    - evidence_queries
    - citations
  required_table_titles:
    - Bowling economy leaderboard
  forbidden_table_titles:
    - Year trend
    - Primary batting metrics
  required_sql_fragments:
    - WHERE NULLIF(TRIM(CAST(bowl AS VARCHAR)), '') IS NOT NULL
    - TRY_CAST(over AS DOUBLE) > 40.0
    - TRY_CAST(year AS INTEGER) >= :year
    - legal_balls >= :min_legal_balls
    - ORDER BY runs_conceded / NULLIF(legal_balls / 6.0, 0) ASC

