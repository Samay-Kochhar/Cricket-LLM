# Split: every question carries `split: dev` or `split: holdout` (stratified 50/50
# per category, seeded shuffle 20261112). Fixes are made by looking at dev failures
# only; the holdout is run once at the end as the real test. Gold plans (the correct
# structured reading of each question) live in multiformat_gold_plans.yaml.
# Multi-format question set (draft, awaiting approval).
# Each question names a non-ODI format or league (or asks about coverage), so it
# exercises the multi-format database. `expect` says what a correct answer must
# contain; numbers are checked against data/cricket_all.duckdb after approval.

